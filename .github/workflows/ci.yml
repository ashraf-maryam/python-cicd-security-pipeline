name: Python CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run token service unit tests
        run: python -m pytest -v test_token_service.py

      - name: Run crypto wallet API security lab tests
        working-directory: labs/crypto-wallet-api-security
        run: python -m unittest discover -s tests -v

      - name: Run Bandit SAST scan
        run: |
          mkdir -p reports
          bandit -r . -f html -o reports/bandit-report.html || true

      - name: Run pip-audit SCA scan
        run: |
          pip-audit -r requirements.txt || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/